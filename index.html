<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Language Web App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>🌐 Polyglot Web Platform</h1></header>
  <main>
    <section id="compute">
      <h2>⚡ C++ Compute Service</h2>
      <input type="number" id="numInput" placeholder="Enter number" min="1">
      <button onclick="callCompute()">Run Heavy Compute</button>
      <pre id="computeResult"></pre>
    </section>

    <section id="notify">
      <h2>☕ Java Notification Service</h2>
      <input type="text" id="msgInput" placeholder="Notification message">
      <button onclick="sendNotification()">Send</button>
      <pre id="notifyResult"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
